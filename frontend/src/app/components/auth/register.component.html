<div class="auth-container">
  <div class="auth-card">
    <h2>Crear Cuenta</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" formControlName="username" placeholder="Elige un usuario">
      </div>
      <div class="form-group">
        <label for="password">Contrasena</label>
        <input type="password" id="password" formControlName="password" placeholder="Crea una contrasena">
      </div>
      <div class="form-group">
        <label for="rol">Rol</label>
        <select id="rol" formControlName="rol">
          <option value="usuario">Usuario</option>
          <option value="trabajador">Trabajador</option>
        </select>
      </div>

      @if (errorMsg) {
        <div class="error">{{ errorMsg }}</div>
      }

      <button type="submit" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Cargando...' : 'Registrarse' }}
      </button>
    </form>
    <p class="switch-auth">
      Ya tienes cuenta? <a routerLink="/login">Inicia sesion aqui</a>
    </p>
  </div>
</div>
