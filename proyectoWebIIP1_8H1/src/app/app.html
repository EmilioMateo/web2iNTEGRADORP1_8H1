<nav class="top-navbar">
  <div class="nav-links">
    <a routerLink="/introduccion" routerLinkActive="active">
      <span class="icon">🏠</span> Introducción
    </a>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="icon">🛍️</span> Catálogo
    </a>
    <a routerLink="/carrito" routerLinkActive="active">
      <span class="icon">🛒</span> Carrito
    </a>
  </div>
  
  <div class="auth-section" style="display: flex; gap: 1rem; align-items: center;">
    @if (authService.user() !== null) {
      @if (authService.user()?.rol === 'trabajador') {
        <span class="worker-badge">Trabajador</span>
      }
      <span style="color: white; font-weight: bold;">Hola, {{ authService.user()?.username }}</span>
      <button (click)="logout()" class="logout-btn">Salir</button>
    } @else {
      <a routerLink="/login" class="login-btn">Iniciar Sesión</a>
    }
  </div>
</nav>

<router-outlet />
